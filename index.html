<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Color RGB Avanzado</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-card shadow-lg p-4 rounded-4 bg-white">
        <h2 class="text-center mb-4 fw-bold text-primary">
            <i class="bi bi-palette-fill me-2"></i>Ajustador de Color RGB
        </h2>
        
        <!-- Recuadro del Color -->
        <div id="color-box" class="mb-4 rounded-4 shadow-sm position-relative overflow-hidden">
            <div class="color-overlay d-flex align-items-center justify-content-center">
                <span id="hex-overlay-text" class="fw-bold fs-4 text-white text-shadow">#808080</span>
            </div>
        </div>

        <!-- Selector de Color Nativo (Color Picker) -->
        <div class="mb-4 text-center">
            <label for="color-picker" class="form-label fw-bold d-block text-secondary">
                <i class="bi bi-eyedropper me-1"></i>Seleccionar desde Paleta:
            </label>
            <input type="color" id="color-picker" class="form-control form-control-color mx-auto w-100 shadow-sm" value="#808080" title="Elige un color">
        </div>

        <!-- Controles Deslizantes e Inputs Numéricos -->
        <div class="mb-3">
            <label for="red" class="form-label text-danger fw-bold">Rojo (R)</label>
            <div class="d-flex align-items-center gap-3">
                <input type="range" class="form-range" id="red" min="0" max="255" value="128">
                <input type="number" class="form-control color-num-input" id="red-num" min="0" max="255" value="128">
            </div>
        </div>

        <div class="mb-3">
            <label for="green" class="form-label text-success fw-bold">Verde (G)</label>
            <div class="d-flex align-items-center gap-3">
                <input type="range" class="form-range" id="green" min="0" max="255" value="128">
                <input type="number" class="form-control color-num-input" id="green-num" min="0" max="255" value="128">
            </div>
        </div>

        <div class="mb-4">
            <label for="blue" class="form-label text-primary fw-bold">Azul (B)</label>
            <div class="d-flex align-items-center gap-3">
                <input type="range" class="form-range" id="blue" min="0" max="255" value="128">
                <input type="number" class="form-control color-num-input" id="blue-num" min="0" max="255" value="128">
            </div>
        </div>

        <!-- Resumen de Valores -->
        <div class="values-container p-3 rounded-3 bg-light border text-center">
            <p class="mb-1 fs-6"><strong>RGB:</strong> <span id="rgb-value" class="font-monospace">rgb(128, 128, 128)</span></p>
            <p class="mb-0 fs-6"><strong>Hexadecimal:</strong> <span id="hex-value" class="font-monospace">#808080</span></p>
        </div>
    </div>

    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
